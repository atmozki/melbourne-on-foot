name: Weekly data refresh

on:
  schedule:
    # Monday 03:30 AEST / 04:30 AEDT in Melbourne, after Sunday's counts land
    - cron: "30 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r pipeline/requirements.txt

      - name: Check ingestion regressions
        run: python -m unittest discover -s tests -v

      - name: Restore raw data for incremental ingestion
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            raw-data-v1-${{ runner.os }}-

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Commit refreshed marts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marts
          if git diff --cached --quiet; then
            echo "Marts unchanged, nothing to commit"
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
